services:
  mysql:
    image: mysql:8.0
    container_name: gochat-mysql
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gochat}
      MYSQL_USER: ${MYSQL_USER:-gochat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --table-open-cache=256
      - --performance-schema=OFF
    # 不映射公网端口：容器间走 compose 内部网络，数据库不对公网开放
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:?}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2
    container_name: gochat-redis
    mem_limit: 128m
    # 不映射公网端口：缓存不对公网开放
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    container_name: gochat-kafka
    mem_limit: 512m
    # 不映射公网端口：消息队列不对公网开放（app 容器经内部网络访问）
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      # 单节点 Kafka 的 JVM 堆；mem_limit 还为 JVM 原生内存预留空间。
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 一次性建表工具：不随 up -d 启动，手动执行：
  #   docker compose --profile tools run --rm migrate
  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GOChat_MYSQL_DSN: "${MYSQL_USER:-gochat}:${MYSQL_PASSWORD:?}@tcp(mysql:3306)/${MYSQL_DATABASE:-gochat}?charset=utf8mb4&parseTime=True&loc=UTC"
    # Dockerfile 的 ENTRYPOINT 默认是 /app/gochat；迁移工具必须覆盖
    # ENTRYPOINT，不能只用 command（否则会把路径当成 server 参数）。
    entrypoint: ["/app/gochat-migrate"]

  # GO-CHAT 应用服务
  app:
    build: .
    container_name: gochat-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      GOChat_CONFIG: "/app/config/config.yaml"
      GOChat_SERVER_ADDR: ":8080"
      GOChat_MYSQL_DSN: "${MYSQL_USER:-gochat}:${MYSQL_PASSWORD:?}@tcp(mysql:3306)/${MYSQL_DATABASE:-gochat}?charset=utf8mb4&parseTime=True&loc=UTC"
      GOChat_REDIS_ADDR: "redis:6379"
      GOChat_KAFKA_BROKERS: "kafka:9092"
      GOChat_AUTH_JWT_SECRET: "${GOCHAT_JWT_SECRET:?请在 .env 中设置 GOCHAT_JWT_SECRET}"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  kafka_data:
